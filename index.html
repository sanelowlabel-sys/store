    <meta charset="UTF-8" />

    <title>Sanelow Label Merch Store</title>
    <script>
      (function() {
        try {
          var _origFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _origFetch;
            },
            set: function(val) {
              _origFetch = val;
            }
          });
        } catch (e) {
          // ignore
        }
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
